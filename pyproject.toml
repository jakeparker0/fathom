[project]
name = "fathom"
version = "0.1.0"
description = "Personal finance management app"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
]


authors = [
    { name = "jakeparker0", email = "jakebparker17@gmail.com" }
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "psycopg[binary]>=3.3.5",
    "pre-commit>=4.6.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Docstring conventions — too noisy for a solo project. Revisit if you
    # ever want enforced docstrings on public functions.
    "D",
    # Conflict with the formatter; ruff's own docs say to disable these.
    "COM812",
    "ISC001",
    # TODO comments are allowed without an author or issue link.
    "TD002",
    "TD003",
    "FIX002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # assert is the point of a test
    "PLR2004",  # magic values are fine in assertions
    "ARG",      # fixtures get passed in unused
]

[tool.ruff.lint.isort]
known-first-party = ["fathom"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
