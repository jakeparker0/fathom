[project]
name = "fathom"
version = "0.1.0"
description = "Personal finance management app"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
]


authors = [
    { name = "jakeparker0", email = "jakebparker17@gmail.com" }
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"